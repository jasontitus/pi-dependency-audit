[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-dependency-audit"
version = "0.1.0"
description = "Resumable dependency reviews and portfolio triage powered by pi-review-bot"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pi-dependency-audit = "pi_dependency_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

